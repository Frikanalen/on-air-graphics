    <title>Frikanalen: straks tilbake</title>
    <!--
      Standby card for CasparCG (1280x720, scaled to the output), for when the
      ordinary programme and graphics cannot be shown. Deliberately one static
      page: no script, no bundle and nothing fetched but the typeface, so it
      shows whatever else is broken. A light travels along the rule
      without end, so a running picture can be told from a frozen one. With the typeface missing it falls back
      to the system sans-serif.

      Served by the graphics image at /graphics/standby/. To put it on air:

        PLAY 1-90 [HTML] "https://frikanalen.tv/graphics/standby/"
        CLEAR 1-90

      A fallback machine that must work without the network keeps its own
      copy of this folder and of ../fonts.
    -->
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url("../fonts/SchibstedGrotesk-latin.woff2") format("woff2");
        font-weight: 400 900;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1926;
        color: #f5efe4;
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
        overflow: hidden;
      }
      /* Everything is sized in vw, so 720p and 1080p get the same picture. */
      main {
        position: absolute;
        inset: 0;
        padding: 0 5vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .logo {
        position: absolute;
        top: 4.375vw;
        left: 5vw;
        width: 14.84vw;
        height: auto;
      }
      h1 {
        margin: 0;
        font-size: 6.6vw;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 1.6vw 0 0;
        font-size: 2.5vw;
        line-height: 1.3;
        opacity: 0.72;
      }
      .rule {
        width: 55vw;
        height: 0.4vw;
        margin-bottom: 3.4vw;
        background: linear-gradient(
          to right,
          #f15645 0 33.3%,
          #faaa3f 33.3% 66.6%,
          #64bc50 66.6%
        );
      }
      /* A light that keeps travelling along the rule: if it stands still,
         the picture is frozen. */
      .rule {
        position: relative;
        overflow: hidden;
      }
      .rule::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        background: linear-gradient(
          to right,
          transparent,
          rgb(255 255 255 / 0.95) 50%,
          transparent
        );
        animation: alive 4s linear infinite;
      }
      @keyframes alive {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(334%);
        }
      }
      /* And the subtitle breathes, for a screen seen from across a room. */
      p {
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.45;
        }
      }
    </style>
